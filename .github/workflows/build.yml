name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APP: build/Build/Products/Release/MeetingAssistant.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MeetingAssistant.xcodeproj \
            -scheme MeetingAssistant \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project MeetingAssistant.xcodeproj \
            -scheme MeetingAssistant \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign
        run: |
          codesign --force --options runtime --entitlements Config/MeetingAssistant.entitlements --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Package .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP" MeetingAssistant.app.zip
          ls -lh MeetingAssistant.app.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MeetingAssistant-app
          path: MeetingAssistant.app.zip
          if-no-files-found: error
