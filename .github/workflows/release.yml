name: release

# Publishes a release when VERSION changes on main (or on demand from main). It never
# re-publishes an existing tag. VERSION is the single source of truth: the tag, the
# app's MARKETING_VERSION and its build number all derive from it, and the build fails
# if they would disagree.
#
# There are three signing modes, each all or nothing (scripts/release-check-signing.sh):
#   ad-hoc     no secrets
#   signed     the three certificate secrets; a stable identity, not notarized, so macOS
#              keeps the app's permissions across updates and Gatekeeper still asks once
#   notarized  all six secrets; signed with Developer ID and notarized
# Any other combination fails before the build. The secrets live in the "release"
# environment and reach only the steps that sign and notarize, never the tests, the
# build or third-party actions.
on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create; must equal the VERSION file (leave empty to use it)"
        required: false

permissions:
  contents: read

jobs:
  release:
    # A dispatch from another branch could ship unreviewed code under the signing identity.
    if: github.ref == 'refs/heads/main'
    environment: release
    # Releases queue instead of racing, and a run is never cancelled halfway: that could
    # leave a tag with no asset, or a notarization submitted and abandoned.
    concurrency:
      group: release
      cancel-in-progress: false
    # Bounds the whole job; notarization has its own limit below.
    timeout-minutes: 75
    permissions:
      contents: write
    runs-on: macos-26
    env:
      APP: build/Build/Products/Release/MeetingAssistant.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/release-resolve-version.sh

      - name: Check whether the release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: scripts/release-exists.sh "$TAG"

      - name: Check signing secrets
        id: signing
        if: steps.existing.outputs.exists != 'true'
        env:
          HAVE_MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAVE_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAVE_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY != '' }}
          HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAVE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAVE_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD != '' }}
        run: scripts/release-check-signing.sh

      - name: Install XcodeGen
        if: steps.existing.outputs.exists != 'true'
        run: scripts/install-xcodegen.sh

      - name: Generate Xcode project
        if: steps.existing.outputs.exists != 'true'
        run: xcodegen generate

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -project MeetingAssistant.xcodeproj \
            -scheme MeetingAssistant \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (Release)
        if: steps.existing.outputs.exists != 'true'
        env:
          APP_VERSION: ${{ steps.ver.outputs.marketing }}
          APP_BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -o pipefail
          xcodebuild \
            -project MeetingAssistant.xcodeproj \
            -scheme MeetingAssistant \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            build

      - name: Verify bundle version
        if: steps.existing.outputs.exists != 'true'
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.marketing }}
          EXPECTED_BUILD: ${{ steps.ver.outputs.build }}
        run: |
          PLIST="$APP/Contents/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          if [ "$VERSION" != "$EXPECTED_VERSION" ] || [ "$BUILD" != "$EXPECTED_BUILD" ]; then
            echo "::error::The built app reports $VERSION ($BUILD) but the release is $EXPECTED_VERSION ($EXPECTED_BUILD)"
            exit 1
          fi

      - name: Sign with certificate
        if: steps.existing.outputs.exists != 'true' && steps.signing.outputs.mode != 'ad-hoc'
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          PUBLIC_CERTIFICATE="$RUNNER_TEMP/certificate.pem"
          TRUSTED=false
          cleanup() {
            if [ "$TRUSTED" = true ]; then sudo security remove-trusted-cert -d "$PUBLIC_CERTIFICATE" || true; fi
            rm -f "$CERTIFICATE" "$PUBLIC_CERTIFICATE"
            security delete-keychain "$KEYCHAIN" || true
          }
          # Later steps, including third-party actions, must not find the key on this runner.
          trap cleanup EXIT
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          identity_is_valid() { security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "\"$MACOS_SIGNING_IDENTITY\""; }
          if ! identity_is_valid; then
            # A self-signed certificate is not trusted by default, and codesign refuses an
            # untrusted identity. This runner is a throwaway machine, and the trust is
            # removed again when the step ends.
            security find-certificate -c "$MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$PUBLIC_CERTIFICATE" || true
            if [ ! -s "$PUBLIC_CERTIFICATE" ]; then
              echo "::error::No certificate named '$MACOS_SIGNING_IDENTITY' was found in MACOS_CERTIFICATE_P12. Check the MACOS_SIGNING_IDENTITY secret against the certificate's name."
              exit 1
            fi
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$PUBLIC_CERTIFICATE"
            TRUSTED=true
          fi
          if ! identity_is_valid; then
            echo "::error::codesign cannot use the signing identity '$MACOS_SIGNING_IDENTITY'. Check MACOS_SIGNING_IDENTITY against the certificate in MACOS_CERTIFICATE_P12."
            exit 1
          fi
          # Apple's timestamp server only matters for a notarized build.
          TIMESTAMP="--timestamp=none"
          if [ "$SIGNING_MODE" = notarized ]; then TIMESTAMP="--timestamp"; fi
          codesign --force --options runtime "$TIMESTAMP" \
            --entitlements Config/MeetingAssistant.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP"

      - name: Ad-hoc sign
        if: steps.existing.outputs.exists != 'true' && steps.signing.outputs.mode == 'ad-hoc'
        run: codesign --force --options runtime --entitlements Config/MeetingAssistant.entitlements --sign - "$APP"

      - name: Verify signature
        if: steps.existing.outputs.exists != 'true'
        run: codesign --verify --strict --verbose=2 "$APP"

      - name: Verify stable code identity
        if: steps.existing.outputs.exists != 'true' && steps.signing.outputs.mode != 'ad-hoc'
        run: |
          # macOS keys permissions on this requirement. A cdhash in it would change with
          # every build and bring back the permission prompts after each update.
          REQUIREMENT="$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^#* *designated => //p')"
          echo "designated requirement: $REQUIREMENT"
          if [ -z "$REQUIREMENT" ] || printf '%s' "$REQUIREMENT" | grep -q cdhash; then
            echo "::error::The signed app's designated requirement is tied to the code hash, so permissions would not survive updates"
            exit 1
          fi

      - name: Package .app
        if: steps.existing.outputs.exists != 'true'
        run: ditto -c -k --sequesterRsrc --keepParent "$APP" MeetingAssistant.app.zip

      - name: Notarize
        id: notarize
        if: steps.existing.outputs.exists != 'true' && steps.signing.outputs.mode == 'notarized'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit MeetingAssistant.app.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          xcrun stapler staple "$APP"
          rm MeetingAssistant.app.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" MeetingAssistant.app.zip
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          NOTARIZED: ${{ steps.notarize.outputs.done }}
        run: scripts/release-notes.sh "$SIGNING_MODE" "$NOTARIZED" > release-notes.md

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          files: MeetingAssistant.app.zip
          body_path: release-notes.md
