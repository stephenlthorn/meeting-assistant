name: MeetingAssistant
options:
  bundleIdPrefix: com.stephenthorn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  MeetingAssistant:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Support/Info.generated.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Meeting Assistant
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSpeechRecognitionUsageDescription: "Transcribes meeting audio on this device to provide live assistance."
        NSMicrophoneUsageDescription: "Captures your microphone so your side of the call is transcribed on-device."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenthorn.meetingassistant
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/MeetingAssistant.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MeetingAssistantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "App/MeetingAssistantApp.swift"
          - "Support/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenthorn.meetingassistant.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  MeetingAssistant:
    build:
      targets:
        MeetingAssistant: [running, profiling, analyzing, archiving]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MeetingAssistantTests
