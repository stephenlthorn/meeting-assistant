name: MeetingAssistant
options:
  bundleIdPrefix: com.stephenthorn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  MeetingAssistant:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Support/Info.generated.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Meeting Assistant
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSpeechRecognitionUsageDescription: "Transcribes call audio into text, on this Mac. If your Mac cannot do that for your language, audio goes to Apple's speech servers only after you allow it in Settings."
        NSMicrophoneUsageDescription: "Captures your microphone so your side of the call can be transcribed. It is transcribed on this Mac unless you turn on Deepgram or Apple's speech servers in Settings."
        NSDocumentsFolderUsageDescription: "Saves your meeting transcripts and summaries as files in your Documents folder (Documents/Meeting Assistant unless you pick another folder), only when you turn on Save transcripts in Settings or choose Save Transcript. The files stay on this Mac."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenthorn.meetingassistant
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/MeetingAssistant.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MeetingAssistantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "App/MeetingAssistantApp.swift"
          - "Support/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenthorn.meetingassistant.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  MeetingAssistant:
    build:
      targets:
        MeetingAssistant: [running, profiling, analyzing, archiving]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MeetingAssistantTests
